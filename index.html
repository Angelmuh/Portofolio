<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/monogram.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070A09" />
    <title>Ange Muhorakeye — UI/UX Designer</title>
    <meta name="description" content="Ange Muhorakeye is a UI/UX designer based in Rwanda, turning complex problems into clear, human digital experiences." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('am-theme');
          var theme = stored || 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
